
<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AKA.interaktivt</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 20px;
      font-family: Roboto, Arial, sans-serif;
      background: #f7f8fa;
      color: #212c60;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 { margin-bottom: 8px; }

    .intro {
      color: #555;
      margin-bottom: 28px;
    }

    .resources {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      display: block;
      padding: 22px;
      border: 1px solid #e1e4e8;
      border-radius: 12px;
      background: white;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.2s;
    }

    .card:hover, .card:focus-visible {
      border-color: #347d76;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 19px;
    }

    .card p {
      color: #555;
      line-height: 1.5;
      font-size: 14px;
    }

    .link {
      color: #347d76;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main>
    <h1>AKA.interaktivt</h1>
    <p class="intro">
      Interaktive undervisningsressurser for Akademiet.
    </p>

    <div class="resources">

      <a class="card" href="canada-timeline/">
        <h2>Territorial Evolution of Canada</h2>
        <p>
          Utforsk utviklingen av Canadas provinser og
          territorier gjennom en interaktiv tidslinje.
        </p>
        <span class="link">Åpne ressurs →</span>
      </a>

    </div>
  </main>
</body>
</html>
