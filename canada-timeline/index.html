
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Territorial Evolution of Canada</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Roboto, Arial, sans-serif;
      color: #222222;
      background: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 16px;
      color: #347d76;
    }

    .map {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      border: 1px solid #dddddd;
    }

    .controls {
      background: #f2f6f5;
      padding: 20px;
      border-radius: 12px;
      margin-top: 15px;
    }

    .counter {
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .timeline {
      display: block;
      width: 100%;
      accent-color: #347d76;
      cursor: pointer;
    }

    .labels {
      display: flex;
      justify-content: space-between;
      color: #555555;
      font-size: 13px;
      margin-top: 8px;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      background: #347d76;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    button:hover:not(:disabled) {
      background: #27635d;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #f08920;
      outline-offset: 3px;
    }


    @media (max-width: 500px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 20px;
      }

      .controls {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Territorial Evolution of Canada</h1>

    <img
      id="canadaMap"
      class="map"
      src="images/00.webp"
      alt="Historical map of Canada in 1867"
      width="1000"
      height="864"
    >

    <div class="controls">

      <div class="counter" id="counter">
        Map 1 of 20
      </div>

      <label for="timeline">
        Explore the historical changes:
      </label>

      <input
        type="range"
        id="timeline"
        class="timeline"
        min="0"
        max="19"
        step="1"
        value="0"
      >

      <div class="labels">
        <span>1867</span>
        <span>2003</span>
      </div>

      <div class="buttons">
        <button type="button" id="previous">
          &larr; Previous
        </button>

        <button type="button" id="next">
          Next &rarr;
        </button>
      </div>

    </div>

  

  </main>

  <script>
    const timeline = document.getElementById("timeline");
    const map = document.getElementById("canadaMap");
    const counter = document.getElementById("counter");
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");

    const totalFrames = 20;

    function updateMap() {
      const frame = Number(timeline.value);
      const fileName = String(frame).padStart(2, "0");

      map.src = "images/" + fileName + ".webp";

      counter.textContent =
        "Map " + (frame + 1) + " of " + totalFrames;

      previous.disabled = frame === 0;
      next.disabled = frame === totalFrames - 1;
    }

    previous.addEventListener("click", function () {
      timeline.value = Math.max(
        0,
        Number(timeline.value) - 1
      );
      updateMap();
    });

    next.addEventListener("click", function () {
      timeline.value = Math.min(
        totalFrames - 1,
        Number(timeline.value) + 1
      );
      updateMap();
    });

    timeline.addEventListener("input", updateMap);

    updateMap();
  </script>

</body>
</html>
